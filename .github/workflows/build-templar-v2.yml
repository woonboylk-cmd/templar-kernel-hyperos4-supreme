name: Build Templar Ultimate Kernel V2.1 (MGLRU Shield + ZSTD + 8 Core Tech)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Templar Ultimate V2.1
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Environment Info
        run: |
          echo "=== BUILD START: Templar Ultimate Kernel V2.1 ==="
          echo "Target Device: Xiaomi 12S (mayfly / 2206123SC)"
          echo "Kernel Base: GKI 5.10.264 LTS + MGLRU Shield Native Engine"
          df -h
          free -m

      - name: 2. Setup Toolchain & Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev bc bison flex make \
            lz4 zip curl wget tar
          
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-14 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          
          clang --version
          ld.lld --version

      - name: 3. Download & Extract Templar-MGLRU Source
        run: |
          echo "Downloading Templar-MGLRU 179MB source tarball..."
          wget -q --show-progress "https://codeload.github.com/Steambot12/Templar-Kernel-GKI-5.10/legacy.tar.gz/refs/heads/Templar-MGLRU" -O templar_mglru.tar.gz
          echo "Extracting source tree..."
          tar -xzf templar_mglru.tar.gz
          mv Steambot12-Templar-Kernel-GKI-5.10-* kernel_src
          rm -f templar_mglru.tar.gz
          echo "Source tree extracted successfully into kernel_src."
          ls -la kernel_src | head -n 10

      - name: 4. Align Version 264 & Inject MGLRU Shield
        run: |
          cd kernel_src
          echo "Aligning SUBLEVEL to 264 in Makefile..."
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 264/' Makefile
          echo "Source aligned to SUBLEVEL $(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')"
          head -n 5 Makefile
          
          if [ -f kernel/module.c ]; then
            echo "Injecting MGLRU Shield into kernel/module.c check_version..."
            python3 -c '
with open("kernel/module.c", "r") as f:
    content = f.read()

# Replace check_version logic with MGLRU Shield filter
old_sig = "static int check_version(const struct load_info *info,"
idx = content.find(old_sig)
if idx != -1:
    body_start = content.find("{", idx)
    body_end = content.find("}", body_start)
    shield_code = """{
	if (info && info->name) {
		if (strstr(info->name, "millet") || strstr(info->name, "migt") ||
		    strstr(info->name, "mi_freqwdg") || strstr(info->name, "perf_helper") ||
		    strstr(info->name, "binder_prio")) {
			pr_info("MGLRU Shield: Safely rejected incompatible Xiaomi module %s\\n", info->name);
			return 0; /* Reject loading conflicting module */
		}
	}
	return 1; /* Bypass CRC for essential hardware vendor modules */
}"""
    content = content[:body_start] + shield_code + content[body_end+1:]
    with open("kernel/module.c", "w") as f:
        f.write(content)
    print("MGLRU Shield injected successfully into kernel/module.c!")
else:
    print("Warning: check_version signature not found")
'
            grep -A 15 "static int check_version" kernel/module.c || true
          fi

      - name: 5. Configure Defconfig & 8 Core Features
        run: |
          cd kernel_src
          echo "Injecting 8 Core Technologies into arch/arm64/configs/gki_defconfig..."
          
          # Feature 1: MGLRU
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN_ENABLED
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN_STATS
          
          # Feature 2: ZSTD & ZRAM Multi-Algo
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_COMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_DECOMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e CRYPTO_ZSTD
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZRAM_DEF_COMP_ZSTD
          
          # Feature 3: TCP Congestion Control (BBRplus / BBR)
          scripts/config --file arch/arm64/configs/gki_defconfig -e TCP_CONG_BBRPLUS
          scripts/config --file arch/arm64/configs/gki_defconfig -e TCP_CONG_BBR
          scripts/config --file arch/arm64/configs/gki_defconfig -e DEFAULT_BBRPLUS
          
          # Feature 4: UKSM
          scripts/config --file arch/arm64/configs/gki_defconfig -e UKSM
          
          # Feature 5: Boeffla Wakelock Blocker
          scripts/config --file arch/arm64/configs/gki_defconfig -e BOEFFLA_WL_BLOCKER
          
          # Feature 6: LRNG & F2FS
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRNG
          scripts/config --file arch/arm64/configs/gki_defconfig -e F2FS_FS
          
          # Feature 7: ThinLTO
          scripts/config --file arch/arm64/configs/gki_defconfig -d LTO_CLANG_FULL
          scripts/config --file arch/arm64/configs/gki_defconfig -e LTO_CLANG_THIN
          
          # Kernel String Branding
          scripts/config --file arch/arm64/configs/gki_defconfig --set-str LOCALVERSION "-Templar-Ultimate-V2.1-MGLRU"
          
          echo "Defconfig preparation finished."

      - name: 6. Compile Kernel (ThinLTO / Polly LLVM)
        run: |
          cd kernel_src
          mkdir -p out
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=woonboy
          export KBUILD_BUILD_HOST=Templar-CI
          
          echo "Generating defconfig..."
          make -j$(nproc) O=out gki_defconfig
          
          echo "Verifying MGLRU and ThinLTO in generated .config:"
          grep "CONFIG_LRU_GEN" out/.config || true
          grep "CONFIG_LTO" out/.config || true
          
          echo "Building Image with $(nproc) threads..."
          make -j$(nproc) O=out Image
          
          ls -lh out/arch/arm64/boot/Image

      - name: 7. Package with AnyKernel3 (GKI Configured)
        run: |
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=Templar Ultimate V2.1 (MGLRU Shield + ZSTD) by woonboy
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mayfly
          device.name2=2206123SC
          device.name3=2206123SG
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          
          cp ../kernel_src/out/arch/arm64/boot/Image .
          zip -r9 ../Templar-Ultimate-V2.1-MGLRU-Shield-mayfly.zip * -x .git README.md *placeholder
          ls -lh ../Templar-Ultimate-V2.1-MGLRU-Shield-mayfly.zip

      - name: 8. Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-Ultimate-V2.1-MGLRU-Shield-mayfly
          path: Templar-Ultimate-V2.1-MGLRU-Shield-mayfly.zip
          retention-days: 7
