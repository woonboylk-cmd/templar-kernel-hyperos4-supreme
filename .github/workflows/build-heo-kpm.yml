name: Build HEO & Arsenal Ring 0 KPMs (Xiaomi 12S)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kpms_src/**'
      - '.github/workflows/build-heo-kpm.yml'

jobs:
  build-kpms:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel 5.10 Matching Toolchain (Clang 14 & LLD 14)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu make zip

      - name: Clone KernelPatch SDK
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Setup Multi-KPM Workspace
        run: |
          mkdir -p KernelPatch/kpms/arsenal
          cp kpms_src/heo_ring0_companion.c KernelPatch/kpms/arsenal/heo-ring0-companion.c
          cp kpms_src/heo_scheduler_titan.c KernelPatch/kpms/arsenal/heo-scheduler-titan.c
          cp kpms_src/pseudo_mglru_supreme.c KernelPatch/kpms/arsenal/pseudo-mglru-supreme.c
          cp kpms_src/pixel11_camera_safe_spoofer.c KernelPatch/kpms/arsenal/pixel11-camera-safe-spoofer.c
          cp kpms_src/pixel11_spoofer_min.c KernelPatch/kpms/arsenal/pixel11-spoofer-min.c
          cp kpms_src/susfs_stealth_root.c KernelPatch/kpms/arsenal/susfs-stealth-root.c

          cat << 'EOF' > KernelPatch/kpms/arsenal/Makefile
          KP_DIR ?= ../..
          CC = clang-14 --target=aarch64-linux-gnu
          LD = aarch64-linux-gnu-ld
          INCLUDE_DIRS := . include patch/include linux/include linux/arch/arm64/include linux/tools/arch/arm64/include
          INCLUDE_FLAGS := $(foreach dir,$(INCLUDE_DIRS),-I$(KP_DIR)/kernel/$(dir))

          CFLAGS := -O2 -fno-pic -fno-pie -fno-common -mcmodel=small -fno-stack-protector -mgeneral-regs-only -ffreestanding -fno-asynchronous-unwind-tables -fno-unwind-tables

          KPMS := heo-ring0-companion.kpm \
                  heo-scheduler-titan.kpm \
                  pseudo-mglru-supreme.kpm \
                  pixel11-camera-safe-spoofer.kpm \
                  pixel11-spoofer-min.kpm \
                  susfs-stealth-root.kpm

          all: $(KPMS)

          %.kpm: %.o
          	${LD} -r -o $@ $^

          %.o: %.c
          	${CC} $(CFLAGS) $(INCLUDE_FLAGS) -c -o $@ $<
          EOF

      - name: Compile All KPM Modules
        run: |
          echo "=== Building Ring 0 Sovereign KPMs with Clang 14 ==="
          make -C KernelPatch/kpms/arsenal
          mkdir -p output_kpms
          cp KernelPatch/kpms/arsenal/*.kpm output_kpms/
          ls -lh output_kpms/

      - name: Verify ELF Relocations (Zero GOT 311/312 for all modules)
        run: |
          echo "=== Auditing Relocations for all KPMs with llvm-readelf ==="
          FAILED=0
          for kpm in output_kpms/*.kpm; do
            echo "--- Checking $(basename $kpm) ---"
            llvm-readelf-14 -r "$kpm"
            if llvm-readelf-14 -r "$kpm" | grep -iE 'GOT|311|312'; then
              echo "ERROR: Unsupported GOT relocation detected in $kpm!"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
          echo "VERIFIED: All KPMs are 100% compliant with KernelPatch 5.10 loader (Zero GOT 311)."
          echo "=== Auditing UNDEF External Symbols with llvm-nm ==="
          for kpm in output_kpms/*.kpm; do
            echo "--- UNDEF in $(basename $kpm) ---"
            llvm-nm-14 -u "$kpm"
          done

      - name: Package KPM Arsenal Archive
        run: |
          cd output_kpms
          zip -9 ../kpm-arsenal-kernel5.10-SM8475.zip *.kpm
          cd ..

      - name: Upload KPM Arsenal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Arsenal-Kernel5.10-SM8475
          path: |
            output_kpms/*.kpm
            kpm-arsenal-kernel5.10-SM8475.zip
