name: Build Templar Supreme V2.3 (MGLRU Shield Final + ZSTD)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Templar Supreme V2.3
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: 1. Environment Info & Cleanup
        run: |
          echo "=== BUILD START: Templar Ultimate Kernel V2.3 ==="
          echo "Target Device: Xiaomi 12S (mayfly / 2206123SC)"
          echo "Kernel Base: GKI 5.10.264 LTS + Targeted Millet Shield"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: 2. Setup Toolchain & Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev bc bison flex make \
            lz4 zip curl wget tar
          
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-14 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          
          clang --version
          ld.lld --version

      - name: 3. Download & Extract Templar-MGLRU Source
        run: |
          echo "Downloading Templar-MGLRU 179MB source tarball..."
          wget -q --show-progress "https://codeload.github.com/Steambot12/Templar-Kernel-GKI-5.10/legacy.tar.gz/refs/heads/Templar-MGLRU" -O templar_mglru.tar.gz
          echo "Extracting source tree..."
          tar -xzf templar_mglru.tar.gz
          mv Steambot12-Templar-Kernel-GKI-5.10-* kernel_src
          rm -f templar_mglru.tar.gz

      - name: 4. Align SUBLEVEL 264 & Inject Targeted Millet Shield
        run: |
          cd kernel_src
          echo "Aligning SUBLEVEL to 264 in Makefile..."
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 264/' Makefile
          head -n 5 Makefile
          
          echo "Applying Targeted Millet Shield patch directly to kernel/module.c..."
          sed -i '/err = setup_load_info(info, flags);/{n;N;d}' kernel/module.c
          sed -i '/err = setup_load_info(info, flags);/a \\tif (err)\n\t\tgoto free_copy;\n\tif (info->name && strstr(info->name, "millet")) {\n\t\tpr_info("MGLRU Shield: Safely rejected incompatible Xiaomi module %s\\n", info->name);\n\t\terr = -ENOEXEC;\n\t\tgoto free_copy;\n\t}' kernel/module.c
          
          grep -C 10 "MGLRU Shield" kernel/module.c

      - name: 5. Configure Defconfig
        run: |
          cd kernel_src
          echo "Injecting features into arch/arm64/configs/gki_defconfig..."
          
          # MGLRU
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN_ENABLED
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRU_GEN_STATS
          
          # ZSTD
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_COMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_DECOMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e CRYPTO_ZSTD
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZRAM_DEF_COMP_ZSTD
          
          # ThinLTO
          scripts/config --file arch/arm64/configs/gki_defconfig -d LTO_CLANG_FULL
          scripts/config --file arch/arm64/configs/gki_defconfig -e LTO_CLANG_THIN
          
          # Kernel String
          scripts/config --file arch/arm64/configs/gki_defconfig --set-str LOCALVERSION "-Templar-Ultimate-V2.3-MGLRU"
          
          echo "Defconfig prepared."

      - name: 6. Compile Kernel (ThinLTO / Polly LLVM)
        run: |
          cd kernel_src
          mkdir -p out
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=woonboy
          export KBUILD_BUILD_HOST=Templar-CI
          
          make -j$(nproc) O=out gki_defconfig
          make -j$(nproc) O=out Image
          ls -lh out/arch/arm64/boot/Image

      - name: 7. Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/BLOCK=.*/block=boot;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/is_slot_device=auto;/' anykernel.sh
          sed -i 's/dump_boot;/split_boot;/' anykernel.sh
          sed -i 's/write_boot;/flash_boot;/' anykernel.sh
          
          cp ../kernel_src/out/arch/arm64/boot/Image .
          zip -r9 ../Templar-Ultimate-V2.3-MGLRU-Shield-mayfly.zip * -x .git README.md *placeholder
          ls -lh ../Templar-Ultimate-V2.3-MGLRU-Shield-mayfly.zip

      - name: 8. Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-Ultimate-V2.3-MGLRU-Shield-mayfly
          path: Templar-Ultimate-V2.3-MGLRU-Shield-mayfly.zip
          retention-days: 7
