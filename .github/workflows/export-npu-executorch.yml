name: Build Qualcomm NPU ExecuTorch Engine (SM8475)

on:
  workflow_dispatch:
    inputs:
      SOC_MODEL:
        description: 'Qualcomm SoC Model (SM8475 for Snapdragon 8+ Gen 1, SM8450, SM8550)'
        required: true
        default: 'SM8475'
      DECODER_MODEL:
        description: 'Decoder Model Architecture'
        required: true
        default: 'llama3_2-1b_instruct'
      EXPORT_MODE:
        description: 'Export Mode'
        required: true
        default: 'hybrid'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-npu-executorch.yml'

jobs:
  build-npu:
    name: Export NPU ExecuTorch PTE + Build Android Runner
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      SOC_MODEL: "${{ inputs.SOC_MODEL || 'SM8475' }}"
      DECODER_MODEL: "${{ inputs.DECODER_MODEL || 'llama3_2-1b_instruct' }}"
      EXPORT_MODE: "${{ inputs.EXPORT_MODE || 'hybrid' }}"

    steps:
      - name: Checkout CI Repository
        uses: actions/checkout@v4

      - name: Clean Disk & Create High-Capacity Swap
        run: |
          echo "=== Freeing maximal disk space ==="
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/local/share/chromium \
                      /usr/share/swift \
                      /var/lib/docker
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          df -h /

          echo "=== Setting up 8GB SWAP ==="
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Setup Build Dependencies & Python 3.10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache clang lld \
            libgflags-dev libabsl-dev \
            python3-pip python3-dev git git-lfs pigz zip unzip curl wget \
            graphviz libgraphviz-dev openjdk-11-jdk-headless
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install executorch==1.4.1 torchao==0.18.0
          python3 -m pip install numpy packaging pyyaml tqdm huggingface_hub requests tabulate pydot py-cpuinfo
          python3 -m pip cache purge || true
          df -h /

      - name: Download Android NDK r26c
        run: |
          echo "=== Downloading Android NDK r26c ==="
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r26c-linux.zip"
          wget -q --show-progress "$NDK_URL" -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -d /opt/
          rm /tmp/ndk.zip
          NDK_PATH=$(find /opt -maxdepth 1 -name "android-ndk-r26*" -type d | head -1)
          echo "NDK_PATH=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK found at: ${NDK_PATH}"
          df -h /

      - name: Setup ExecuTorch Repository
        run: |
          echo "=== Cloning ExecuTorch v1.4.1 (FULL submodules) ==="
          git clone --depth=1 --branch v1.4.1 https://github.com/pytorch/executorch.git executorch || \
          git clone --depth=1 https://github.com/pytorch/executorch.git executorch
          cd executorch
          git submodule sync --recursive
          # FULL recursive update - do NOT restrict to a path list!
          # (restricted list caused missing Eigen/XNNPACK/tokenizers across rounds 1-5)
          git submodule update --init --recursive --depth=1 || true
          # Verify critical third-party deps exist before proceeding
          ls kernels/optimized/third-party/eigen/blas/single.cpp >/dev/null 2>&1 && echo "EIGEN OK" || echo "EIGEN MISSING"
          ls backends/xnnpack/third-party/XNNPACK/CMakeLists.txt >/dev/null 2>&1 && echo "XNNPACK OK" || echo "XNNPACK MISSING"
          python3 -m pip install -r backends/qualcomm/requirements.txt || true
          mkdir -p backends/arm/third-party/serialization_lib/python/serializer
          touch backends/arm/third-party/serialization_lib/python/serializer/__init__.py
          pip install --no-build-isolation -e . || true

      - name: Setup Qualcomm AI Engine Direct (QNN) SDK
        run: |
          cd executorch
          echo "=== Downloading and Staging Qualcomm QNN SDK ==="
          python3 backends/qualcomm/scripts/download_qnn_sdk.py --install-sdk
          QNN_DIR=$(python3 backends/qualcomm/scripts/download_qnn_sdk.py --print-sdk-path)
          echo "Resolved QNN_SDK_ROOT: ${QNN_DIR}"
          echo "QNN_SDK_ROOT=${QNN_DIR}" >> $GITHUB_ENV
          echo "${QNN_DIR}/lib/x86_64-linux-clang" | sudo tee /etc/ld.so.conf.d/qualcomm.conf
          sudo ldconfig
          echo "LD_LIBRARY_PATH=${QNN_DIR}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "PYTHONPATH=$PWD:$PWD/examples:${PYTHONPATH}" >> $GITHUB_ENV

      - name: Inspect Qualcomm Backends & Environment
        run: |
          cd executorch
          echo "=== Qualcomm Backend Verification ==="
          echo "QNN_SDK_ROOT: $QNN_SDK_ROOT"
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH}"
          ls -la "$QNN_SDK_ROOT/lib/x86_64-linux-clang" || true
          python3 -c "import torch, executorch, torchao; print('PyTorch:', torch.__version__, 'TorchAO:', torchao.__version__, 'ExecuTorch ready')"
          python3 -c "import executorch.backends.qualcomm; print('Qualcomm Backend successfully loaded!')"

      - name: Export PTE Models for Target SoC (${{ env.SOC_MODEL }})
        run: |
          mkdir -p output_artifacts
          mkdir -p executorch/build-android
          cd executorch
          export PYTHONPATH=$PWD:$PWD/examples:${PYTHONPATH}
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH}"

          echo "=== 1. Exporting Qualcomm Hexagon HTP MobileNetV2 PTE ==="
          python3 -m examples.qualcomm.scripts.export_example \
            -m mv2 \
            -g \
            -f ../output_artifacts/ \
            --soc "${SOC_MODEL}" \
            -q ptq

          echo "=== 2. Exporting Qualcomm Hexagon HTP Linear Demo PTE ==="
          python3 -m examples.qualcomm.scripts.export_example \
            -m linear \
            -g \
            -f ../output_artifacts/ \
            --soc "${SOC_MODEL}" \
            -q ptq

          echo "=== Artifact Verification ==="
          ls -lh ../output_artifacts/
          COUNT=$(ls -1 ../output_artifacts/*.pte 2>/dev/null | wc -l)
          echo "Total .pte binaries created: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "CRITICAL: No .pte binaries were generated!"
            exit 1
          fi

      - name: Build ExecuTorch Android Runtime (Phase 1 - arm64-v8a)
        run: |
          cd executorch
          echo "=== Phase 1: Build ExecuTorch Core Runtime for Android arm64 ==="
          mkdir -p cmake-android-out

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_BUILD_QNN=ON \
            -DQNN_SDK_ROOT="${QNN_SDK_ROOT}" \
            -DEXECUTORCH_BUILD_DEVTOOLS=ON \
            -DEXECUTORCH_ENABLE_EVENT_TRACER=ON \
            -DEXECUTORCH_BUILD_EXTENSION_MODULE=ON \
            -DEXECUTORCH_BUILD_EXTENSION_DATA_LOADER=ON \
            -DEXECUTORCH_BUILD_EXTENSION_FLAT_TENSOR=ON \
            -DEXECUTORCH_BUILD_EXTENSION_NAMED_DATA_MAP=ON \
            -DEXECUTORCH_BUILD_EXTENSION_TENSOR=ON \
            -DEXECUTORCH_BUILD_KERNELS_QUANTIZED=ON \
            -DEXECUTORCH_ENABLE_LOGGING=ON \
            -DCMAKE_INSTALL_PREFIX=cmake-android-out/install \
            -Bcmake-android-out \
            -GNinja \
            .

          cmake --build cmake-android-out \
            --target install \
            --parallel $(nproc) 2>&1 | tail -n 40

          echo "=== Phase 1 complete ==="
          ls -lh cmake-android-out/install/lib/ 2>/dev/null | head -25 || true

      - name: Build Abseil (absl) for Android arm64
        run: |
          echo "=== Building Abseil for Android NDK (needed by QNN runner) ==="
          git clone --depth=1 https://github.com/abseil/abseil-cpp.git /tmp/abseil-src
          cmake -S /tmp/abseil-src -B /tmp/abseil-build \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DABSL_BUILD_TESTING=OFF \
            -DABSL_USE_EXTERNAL_GOOGLETEST=OFF \
            -DABSL_ENABLE_INSTALL=ON \
            -DABSL_PROPAGATE_CXX_STD=ON \
            -DCMAKE_INSTALL_PREFIX=/tmp/abseil-install
          cmake --build /tmp/abseil-build --parallel $(nproc) 2>&1 | tail -n 10
          cmake --install /tmp/abseil-build
          echo "=== Verifying absl cmake config files ==="
          ls /tmp/abseil-install/lib/cmake/absl/ 2>/dev/null | head -5 || echo "WARNING: absl cmake dir missing!"
          echo "Abseil build done"

      - name: Build qnn_executor_runner Binary (Phase 2 - arm64-v8a)
        run: |
          set -o pipefail
          cd executorch
          echo "=== Phase 2: Build qnn_executor_runner ==="
          mkdir -p cmake-qnn-runner-out

          echo "--- Patching: disable oss_scripts and qaihub_scripts in examples/qualcomm/CMakeLists.txt ---"
          QUALCOMM_CMAKE="examples/qualcomm/CMakeLists.txt"
          if [ -f "$QUALCOMM_CMAKE" ]; then
            cp "$QUALCOMM_CMAKE" "$QUALCOMM_CMAKE.bak"
            sed -i -e 's|add_subdirectory(.*oss_scripts|# [DISABLED] &|' "$QUALCOMM_CMAKE"
            sed -i -e 's|add_subdirectory(.*qaihub_scripts|# [DISABLED] &|' "$QUALCOMM_CMAKE"
            echo "  Patch done. Active add_subdirectory remaining:"
            grep -n "^[^#]*add_subdirectory" "$QUALCOMM_CMAKE" || true
          fi

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_BUILD_QNN=ON \
            -DQNN_SDK_ROOT="${QNN_SDK_ROOT}" \
            -DCMAKE_PREFIX_PATH="$PWD/cmake-android-out/install;$PWD/cmake-android-out/install/lib/cmake/ExecuTorch;$PWD/cmake-android-out/third-party/gflags;/tmp/abseil-install" \
            -DCMAKE_LIBRARY_PATH="$PWD/cmake-android-out/install/lib" \
            -Dabsl_DIR="/tmp/abseil-install/lib/cmake/absl" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DPYTHON_EXECUTABLE=python3 \
            -DQAIHUB_BUILD_ALL=OFF \
            -Bcmake-qnn-runner-out \
            -GNinja \
            examples/qualcomm

          cmake --build cmake-qnn-runner-out \
            --target qnn_executor_runner \
            --parallel $(nproc)

          echo "=== Locating binary ==="
          mkdir -p ../output_artifacts/bin
          mkdir -p ../output_artifacts/lib

          RUNNER_BIN=$(find cmake-qnn-runner-out -type f -name "qnn_executor_runner" -perm -111 2>/dev/null | head -1)
          if [ -z "$RUNNER_BIN" ]; then
            RUNNER_BIN="cmake-qnn-runner-out/executor_runner/qnn_executor_runner"
          fi

          if [ -f "$RUNNER_BIN" ]; then
            cp "$RUNNER_BIN" ../output_artifacts/bin/qnn_executor_runner
            echo "SUCCESS: qnn_executor_runner ready"
            ls -lh ../output_artifacts/bin/
            file ../output_artifacts/bin/qnn_executor_runner
          else
            echo "CRITICAL: Runner binary not found!"
            find cmake-qnn-runner-out -type f | head -30
            exit 1
          fi

          # Copy QNN HTP arm64 shared libs needed on-device
          echo "=== Copying QNN HTP arm64 shared libs ==="
          cp "${QNN_SDK_ROOT}"/lib/aarch64-android/libQnnHtp*.so ../output_artifacts/lib/ 2>/dev/null && \
            echo "HTP libs copied OK" || echo "No HTP libs at expected path"

          # Copy QNN HTP Hexagon DSP skeleton libs needed on-device (v68, v69, v73, v75)
          echo "=== Copying QNN HTP Hexagon DSP skel libs ==="
          find "${QNN_SDK_ROOT}"/lib/hexagon-* -name "*Skel.so" -exec cp -vf {} ../output_artifacts/lib/ \;

          # Copy ExecuTorch QNN backend shared library
          echo "=== Copying ExecuTorch QNN backend shared library ==="
          find cmake-android-out/install -name "libqnn_executorch_backend.so" -exec cp -vf {} ../output_artifacts/lib/ \;
          cp -vf ../output_artifacts/lib/libqnn_executorch_backend.so ../output_artifacts/bin/ 2>/dev/null || true

          echo "=== Artifacts verification ==="
          ls -lh ../output_artifacts/bin/ 2>/dev/null || true
          ls -lh ../output_artifacts/lib/ 2>/dev/null || true

      - name: Package & Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npu-executorch-${{ env.SOC_MODEL }}
          path: |
            output_artifacts/
          if-no-files-found: warn
