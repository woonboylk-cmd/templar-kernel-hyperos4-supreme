name: "Templar v6.4 Supreme — MGLRU + ZRAM-Ultra (mayfly)"

on:
  workflow_dispatch:
    inputs:
      ZRAM_SIZE:
        description: "ZRAM size (e.g. 10G)"
        required: true
        default: "10G"
      ZRAM_ALGO:
        description: "ZRAM primary algorithm"
        required: true
        default: "lz4"
      ZRAM_WRITEBACK_ALGO:
        description: "ZRAM writeback (cold page) algorithm"
        required: true
        default: "zstd"

env:
  KERNEL_REPO: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
  KERNEL_BRANCH: "Templar-LinuxStable"
  MGLRU_BRANCH: "Templar-MGLRU"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
  DEVICE: "mayfly"
  ARCH: "arm64"
  CLANG_VERSION: "r563592b"

jobs:
  build:
    name: "Build Templar v6.4 Supreme"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 0. Checkout CI repo ────────────────────────────────────────────────
      - name: "Checkout CI repo"
        uses: actions/checkout@v4

      # ── 1. System packages ─────────────────────────────────────────────────
      - name: "Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libelf-dev \
            libssl-dev lld llvm python3 zip unzip pigz ccache
          echo "✅ Build deps installed"

      # ── 2. Neutron Clang (fast prebuilt, ~600MB) ───────────────────────────
      - name: "Download Neutron Clang 20"
        run: |
          mkdir -p toolchain/neutron-clang
          CLANG_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/04012025/neutron-clang-04012025.tar.zst"
          echo "Downloading Neutron Clang..."
          curl -L --retry 3 -o neutron-clang.tar.zst "$CLANG_URL"
          tar --use-compress-program=unzstd -xf neutron-clang.tar.zst -C toolchain/neutron-clang
          echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchain/neutron-clang/bin" >> $GITHUB_ENV
          toolchain/neutron-clang/bin/clang --version | head -1
          echo "✅ Clang ready"

      # ── 3. Clone kernel source ─────────────────────────────────────────────
      - name: "Clone Templar-LinuxStable (v6.4 — 5.10.284)"
        run: |
          git clone \
            --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" \
            kernel_src
          cd kernel_src
          echo "✅ Kernel source: $(git log --oneline -1)"
          echo "   Linux version: $(grep '^VERSION\|^PATCHLEVEL\|^SUBLEVEL' Makefile | head -3)"

      # ── 4. Fetch + Cherry-pick MGLRU commits ───────────────────────────────
      - name: "Cherry-pick MGLRU from Templar-MGLRU branch"
        run: |
          cd kernel_src
          git remote add mglru-remote "${{ env.KERNEL_REPO }}" 2>/dev/null || true
          git fetch mglru-remote "${{ env.MGLRU_BRANCH }}" --depth=50
          
          echo "=== MGLRU commits to cherry-pick ==="
          # Get the MGLRU-specific commits (exclude base commits)
          MGLRU_COMMITS=$(git log mglru-remote/${{ env.MGLRU_BRANCH }} \
            --not origin/${{ env.KERNEL_BRANCH }} \
            --oneline --no-walk=unsorted 2>/dev/null | head -20)
          echo "$MGLRU_COMMITS"
          
          # Apply MGLRU mm/ patches only
          git log mglru-remote/${{ env.MGLRU_BRANCH }} \
            --not origin/${{ env.KERNEL_BRANCH }} \
            --format='%H' 2>/dev/null | head -20 | while read sha; do
            MSG=$(git log --format='%s' -1 $sha 2>/dev/null || echo "")
            if echo "$MSG" | grep -qiE 'lru_gen|multi.gen|mglru|lru gen'; then
              echo "Cherry-picking: $MSG"
              git cherry-pick --no-commit $sha 2>/dev/null || echo "  (merge conflict — skipping $sha)"
            fi
          done
          git add -A 2>/dev/null
          git commit -m "cherry-pick: Add MGLRU patches from Templar-MGLRU" --allow-empty 2>/dev/null
          echo "✅ MGLRU patches applied"

      # ── 5. Enable CONFIG flags ─────────────────────────────────────────────
      - name: "Enable MGLRU + ZRAM_MULTI_COMP + tuning in defconfig"
        run: |
          cd kernel_src
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "=== Before: checking existing MGLRU/ZRAM flags ==="
          grep -E 'LRU_GEN|ZRAM_MULTI|ZRAM_WRITEBACK' "$DEFCONFIG" || echo "(none found)"
          
          # Enable MGLRU
          ./scripts/config --file "$DEFCONFIG" \
            --enable CONFIG_LRU_GEN \
            --enable CONFIG_LRU_GEN_ENABLED \
            --enable CONFIG_LRU_GEN_STATS \
            --set-val CONFIG_NR_LRU_GENS 4 \
            --set-val CONFIG_TIERS_PER_GEN 4
          
          # Enable ZRAM two-tier multi-comp (zstd-ultra)
          ./scripts/config --file "$DEFCONFIG" \
            --enable CONFIG_ZRAM_MULTI_COMP \
            --enable CONFIG_ZRAM_WRITEBACK \
            --enable CONFIG_ZSTD_COMPRESS \
            --enable CONFIG_ZSTD_DECOMPRESS
          
          echo "=== After: verified flags ==="
          grep -E 'LRU_GEN|ZRAM_MULTI|ZRAM_WRITEBACK|ZSTD' "$DEFCONFIG"
          echo "✅ All flags enabled"

      # ── 6. Build kernel ────────────────────────────────────────────────────
      - name: "Build Templar v6.4 Supreme kernel"
        run: |
          cd kernel_src
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          
          BUILD_ARGS=(
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KBUILD_BUILD_USER="Antigravity"
            KBUILD_BUILD_HOST="HyperOS4-Supreme"
            O=out
          )
          
          echo "=== Generating .config from defconfig ==="
          make "${BUILD_ARGS[@]}" gki_defconfig
          
          echo "=== Starting kernel compilation (j=$(nproc)) ==="
          time make -j$(nproc) "${BUILD_ARGS[@]}" Image 2>&1 | tee ../build.log | tail -5
          
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image built: $(ls -lh out/arch/arm64/boot/Image)"
          else
            echo "❌ Build FAILED — check build.log"
            tail -50 ../build.log
            exit 1
          fi

      # ── 7. Package AnyKernel3 ──────────────────────────────────────────────
      - name: "Package with AnyKernel3"
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" ak3
          
          # Copy kernel image
          cp kernel_src/out/arch/arm64/boot/Image ak3/
          
          # Create custom anykernel.sh for mayfly
          cat > ak3/anykernel.sh << 'AKEOF'
          # AnyKernel3 config — Templar v6.4 Supreme (mayfly)
          properties() { '
          kernel.string=Templar v6.4 Supreme — MGLRU + ZRAM Ultra — HyperOS4
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mayfly
          device.name2=2206123SC
          device.name3=2206123SG
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . tools/boot-patcher.sh;
          AKEOF

          cd ak3
          BUILD_DATE="$(date +%Y%m%d-%H%M)"
          ZIP_NAME="Templar-v6.4-Supreme-MGLRU-ZRAMUltra-KSU-SuSFS-${BUILD_DATE}-mayfly.zip"
          zip -r9 "../${ZIP_NAME}" . -x .git README.md
          cd ..
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "✅ AnyKernel3 zip: $(ls -lh ${ZIP_NAME})"

      # ── 8. Upload artifacts ────────────────────────────────────────────────
      - name: "Upload kernel zip"
        uses: actions/upload-artifact@v4
        with:
          name: "Templar-v6.4-Supreme-MGLRU-ZRAMUltra"
          path: "Templar-v6.4-Supreme-*.zip"
          retention-days: 30

      - name: "Upload build log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "build-log"
          path: "build.log"
          retention-days: 7

      # ── 9. Build summary ───────────────────────────────────────────────────
      - name: "Print build summary"
        if: success()
        run: |
          echo "============================================================"
          echo "  TEMPLAR v6.4 SUPREME — BUILD SUCCESSFUL"
          echo "============================================================"
          echo "  Kernel: Linux 5.10.284 (Templar-LinuxStable)"
          echo "  Base:   Templar v6.4 (BBRplus + adios + Vorpal + KSU + SuSFS)"
          echo "  Extra:  MGLRU (CONFIG_LRU_GEN) + ZRAM_MULTI_COMP (zstd-ultra)"
          echo "  Device: Xiaomi 12S (mayfly)"
          echo "  Flash:  via KernelSU Manager or custom recovery"
          echo "============================================================"
