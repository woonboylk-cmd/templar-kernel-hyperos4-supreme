name: Build Templar v6.4 Supreme

on:
  workflow_dispatch:
    inputs:
      ZRAM_SIZE:
        description: 'ZRAM size in GB'
        default: '10G'
        required: false

env:
  ARCH: arm64

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu pigz zip unzip
          echo "=== Tools check ==="
          clang --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          ld.lld --version | head -n 1

      - name: Clone Templar Kernel Source
        timeout-minutes: 15
        run: |
          git clone --depth=1 --filter=blob:none --branch Templar-LinuxStable \
            https://github.com/Steambot12/Templar-Kernel-GKI-5.10 \
            kernel_src
          cd kernel_src
          echo "Cloned commit: $(git log --oneline -1)"

      - name: Cherry-pick MGLRU
        timeout-minutes: 10
        run: |
          cd kernel_src
          git remote add mglru https://github.com/Steambot12/Templar-Kernel-GKI-5.10
          git fetch mglru Templar-MGLRU --depth=30 --filter=blob:none
          
          echo "Checking MGLRU commits..."
          for sha in $(git log mglru/Templar-MGLRU --not HEAD --format="%H" | head -n 25); do
            msg=$(git log --format='%s' -1 "$sha" || echo "")
            if echo "$msg" | grep -qiE 'lru.gen|multi.gen|mglru|lru gen'; then
              echo "Applying: $msg"
              git cherry-pick --no-commit "$sha" || git checkout -- .
            fi
          done
          git add -A
          git commit --allow-empty -m "feat: cherry-pick MGLRU from Templar-MGLRU"
          echo "MGLRU patches applied."

      - name: Configure defconfig
        timeout-minutes: 5
        run: |
          cd kernel_src
          DEF="arch/arm64/configs/gki_defconfig"
          
          # Enable MGLRU
          ./scripts/config --file "$DEF" \
            --enable CONFIG_LRU_GEN \
            --enable CONFIG_LRU_GEN_ENABLED \
            --enable CONFIG_LRU_GEN_STATS \
            --set-val CONFIG_NR_LRU_GENS 4 \
            --set-val CONFIG_TIERS_PER_GEN 4
            
          # Enable ZRAM Multi-comp
          ./scripts/config --file "$DEF" \
            --enable CONFIG_ZRAM_MULTI_COMP \
            --enable CONFIG_ZRAM_WRITEBACK \
            --enable CONFIG_ZSTD_COMPRESS \
            --enable CONFIG_ZSTD_DECOMPRESS
            
          echo "=== Verified Defconfig Flags ==="
          grep -E 'LRU_GEN|ZRAM_MULTI|ZRAM_WRITE|ZSTD' "$DEF" || true

      - name: Build Kernel Image
        timeout-minutes: 90
        run: |
          cd kernel_src
          
          CLANG_BIN=clang
          LLD_BIN=ld.lld
          if command -v clang-14 >/dev/null 2>&1; then
            CLANG_BIN=clang-14
            LLD_BIN=ld.lld-14
          fi
          
          make ARCH=arm64 O=out CC=$CLANG_BIN CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LD=$LLD_BIN gki_defconfig
          
          echo "=== Starting Compilation with $(nproc) cores ==="
          make -j$(nproc) ARCH=arm64 O=out CC=$CLANG_BIN CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LD=$LLD_BIN Image
          
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image successfully built:"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Package with AnyKernel3
        timeout-minutes: 5
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel_src/out/arch/arm64/boot/Image ak3/Image
          
          cat > ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Templar v6.4 Supreme MGLRU+ZRAMUltra by Antigravity CI
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mayfly
          device.name2=2206123SC
          device.name3=2206123SG
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          . tools/boot-patcher.sh;
          EOF
          
          cd ak3
          DATE=$(date +%Y%m%d_%H%M)
          ZIP_NAME="Templar-v6.4-Supreme-MGLRU-ZRAMUltra-mayfly-${DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git README.md
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh "${ZIP_NAME}"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Templar-v6.4-Supreme-mayfly
          path: Templar-v6.4-Supreme-*.zip
          retention-days: 30
