name: Build Templar v6.4 Pure APatch Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Templar v6.4 Pure APatch (EEVDF + Le9uo + ZSTD)
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Environment Info
        run: |
          echo "=== BUILD START: Templar v6.4 Pure APatch Edition ==="
          echo "Target Device: Xiaomi 12S (mayfly / 2206123SC / 2206123SG)"
          echo "Kernel Base: Steambot12 Templar-LinuxStable (5.10.264 LTS + EEVDF + Le9uo)"
          df -h
          free -m

      - name: 2. Setup Toolchain & Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev bc bison flex make \
            lz4 zip curl wget tar python3
          
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-14 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          
          clang --version
          ld.lld --version

      - name: 3. Download & Extract Templar v6.4 Source
        run: |
          echo "Downloading Templar-LinuxStable v6.4 source tarball..."
          wget -q --show-progress "https://codeload.github.com/Steambot12/Templar-Kernel-GKI-5.10/legacy.tar.gz/refs/heads/Templar-LinuxStable" -O templar_v64.tar.gz
          echo "Extracting source tree..."
          tar -xzf templar_v64.tar.gz
          mv Steambot12-Templar-Kernel-GKI-5.10-* kernel_src
          rm -f templar_v64.tar.gz
          echo "Source tree extracted successfully."
          ls -la kernel_src | head -n 10

      - name: 4. Verify Sublevel 264 & Clean KSU for Pure APatch
        run: |
          cd kernel_src
          echo "Checking Makefile SUBLEVEL..."
          grep '^SUBLEVEL = ' Makefile
          
          echo "Disabling KernelSU in drivers/Kconfig if referenced..."
          if [ -d drivers/kernelsu ]; then
            echo "Stripping KernelSU driver directory..."
            rm -rf drivers/kernelsu
          fi

      - name: 5. Configure Defconfig (EEVDF + Le9uo + ZSTD + ThinLTO + Pure APatch)
        run: |
          cd kernel_src
          echo "Patching arch/arm64/configs/gki_defconfig..."
          
          # 1. PURE APATCH: Disable KSU to prevent Dual-Root Zygote collisions
          scripts/config --file arch/arm64/configs/gki_defconfig -d KSU
          scripts/config --file arch/arm64/configs/gki_defconfig -d KSU_NEXT
          scripts/config --file arch/arm64/configs/gki_defconfig -d KSU_DEBUG
          scripts/config --file arch/arm64/configs/gki_defconfig -d KSU_MANUAL_HOOK
          scripts/config --file arch/arm64/configs/gki_defconfig -d KSU_SUSFS
          
          # 2. ZSTD ZRAM Acceleration
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_COMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZSTD_DECOMPRESS
          scripts/config --file arch/arm64/configs/gki_defconfig -e CRYPTO_ZSTD
          scripts/config --file arch/arm64/configs/gki_defconfig -e ZRAM_DEF_COMP_ZSTD
          
          # 3. TCP BBRplus / BBR3
          scripts/config --file arch/arm64/configs/gki_defconfig -e TCP_CONG_BBRPLUS
          scripts/config --file arch/arm64/configs/gki_defconfig -e TCP_CONG_BBR
          scripts/config --file arch/arm64/configs/gki_defconfig -e DEFAULT_BBRPLUS
          
          # 4. Boeffla Wakelock Blocker & LRNG
          scripts/config --file arch/arm64/configs/gki_defconfig -e BOEFFLA_WL_BLOCKER
          scripts/config --file arch/arm64/configs/gki_defconfig -e LRNG
          
          # 5. ThinLTO (Prevents GitHub Action 33GB virtual memory OOM)
          scripts/config --file arch/arm64/configs/gki_defconfig -d LTO_CLANG_FULL
          scripts/config --file arch/arm64/configs/gki_defconfig -e LTO_CLANG_THIN
          
          # 6. Kernel Branding String
          scripts/config --file arch/arm64/configs/gki_defconfig --set-str LOCALVERSION "-Templar-6.4-Pure-APatch-ZSTD"
          
          echo "Defconfig patched successfully."

      - name: 6. Compile Kernel (LLVM / Clang 14 ThinLTO)
        run: |
          cd kernel_src
          mkdir -p out
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=woonboy
          export KBUILD_BUILD_HOST=Templar-CI
          
          echo "Generating defconfig..."
          make -j$(nproc) O=out gki_defconfig
          
          echo "Verifying ThinLTO and KSU status in .config:"
          grep "CONFIG_LTO" out/.config || true
          grep "CONFIG_KSU" out/.config || echo "KSU successfully disabled!"
          grep "CONFIG_ZSTD" out/.config || true
          
          echo "Building Kernel Image with $(nproc) threads..."
          make -j$(nproc) O=out Image
          
          ls -lh out/arch/arm64/boot/Image

      - name: 7. Package AnyKernel3 Flashable ZIP
        run: |
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=Templar v6.4 Pure APatch Edition (EEVDF + Le9uo + ZSTD) by woonboy
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mayfly
          device.name2=2206123SC
          device.name3=2206123SG
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          
          cp ../kernel_src/out/arch/arm64/boot/Image .
          zip -r9 ../Templar-6.4-Pure-APatch-ZSTD-mayfly.zip * -x .git README.md *placeholder
          ls -lh ../Templar-6.4-Pure-APatch-ZSTD-mayfly.zip

      - name: 8. Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-6.4-Pure-APatch-ZSTD-mayfly
          path: Templar-6.4-Pure-APatch-ZSTD-mayfly.zip
          retention-days: 7